name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag to publish
        required: true
        type: string
  push:
    tags:
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-v*.*.*'

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged source
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify release identity and history
        # Reject invalid versions, missing notes, lightweight tags and unstable commits.
        run: node scripts/verify-release.mjs "$RELEASE_TAG"

      - name: Test the source
        # Run all source tests before producing a release artifact.
        run: node --test

      - name: Build the standalone page
        # Generate the single HTML deliverable from this exact tagged source.
        run: node scripts/build.mjs

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Publish only the HTML, using the verified tag and checked-in notes.
        run: gh release create "$RELEASE_TAG" outputs/regex-studio.html --verify-tag --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest

      - name: Verify the published HTML
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Download the published asset into this job's temporary directory.
          gh release download "$RELEASE_TAG" --pattern regex-studio.html --dir "$RUNNER_TEMP/release-download"
          # Fail if GitHub serves anything other than the artifact built from this tag.
          cmp outputs/regex-studio.html "$RUNNER_TEMP/release-download/regex-studio.html"
          # Record the verified artifact digest in the workflow summary.
          sha256sum outputs/regex-studio.html >> "$GITHUB_STEP_SUMMARY"
